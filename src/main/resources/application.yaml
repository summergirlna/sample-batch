spring:
  application:
    name: sample-batch

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: never

  sql:
    init:
      mode: never

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sample_batch}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sample_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sample_password}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sample_user}
    password: ${RABBITMQ_PASSWORD:sample_password}

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}

sftp:
  host: ${SFTP_HOST:localhost}
  port: ${SFTP_PORT:2222}
  username: ${SFTP_USERNAME:sample_user}
  password: ${SFTP_PASSWORD:sample_password}
  remote-directory: ${SFTP_REMOTE_DIRECTORY:/upload}

report:
  queue-name: ${REPORT_QUEUE_NAME:user-name-list-report.request}

logging:
  level:
    org.springframework.batch: INFO