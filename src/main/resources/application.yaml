spring:
  application:
    name: sample-batch

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

  datasource:
    url: jdbc:h2:mem:sample_batch
    driver-class-name: org.h2.Driver
    username: sa
    password:

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}

sftp:
  host: ${SFTP_HOST:localhost}
  port: ${SFTP_PORT:2222}
  username: ${SFTP_USERNAME:sample_user}
  password: ${SFTP_PASSWORD:sample_password}
  remote-directory: ${SFTP_REMOTE_DIRECTORY:/upload}

logging:
  level:
    org.springframework.batch: INFO