<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <title th:text="${title}">ユーザ名一覧</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }

        body {
            font-family: "Noto Sans JP", sans-serif;
            font-size: 12px;
            color: #222;
        }

        .report-header {
            margin-bottom: 16px;
        }

        .report-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 0 0 12px 0;
        }

        .report-meta {
            width: 100%;
            margin-bottom: 12px;
            font-size: 11px;
        }

        .report-meta td {
            padding: 2px 0;
        }

        .report-meta .label {
            width: 80px;
            font-weight: bold;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .user-table th,
        .user-table td {
            border: 1px solid #333;
            padding: 6px 8px;
            vertical-align: middle;
            word-break: break-all;
        }

        .user-table th {
            background-color: #eeeeee;
            font-weight: bold;
            text-align: center;
        }

        .user-table .no-column {
            width: 40px;
            text-align: right;
        }

        .user-table .id-column {
            width: 260px;
        }

        .user-table .name-column {
            width: auto;
        }

        .empty-message {
            margin-top: 24px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
<header class="report-header">
    <h1 class="report-title" th:text="${title}">ユーザ名一覧</h1>

    <table class="report-meta">
        <tbody>
        <tr>
            <td class="label">作成日時</td>
            <td th:text="${createdAt}">2026-08-08 12:34:56</td>
        </tr>
        </tbody>
    </table>
</header>

<main>
    <table class="user-table" th:if="${!#lists.isEmpty(rows)}">
        <thead>
        <tr>
            <th class="no-column">No</th>
            <th class="id-column">ID</th>
            <th class="name-column">名前</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row, stat : ${rows}">
            <td class="no-column" th:text="${stat.count}">1</td>
            <td class="id-column" th:text="${row.id}">123e4567-e89b-12d3-a456-426614174000</td>
            <td class="name-column" th:text="${row.name}">山田太郎</td>
        </tr>
        </tbody>
    </table>

    <div class="empty-message" th:if="${#lists.isEmpty(rows)}">
        出力対象のユーザが存在しません。
    </div>
</main>
</body>
</html>
